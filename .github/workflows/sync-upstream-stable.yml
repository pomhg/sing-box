name: Build upstream stable with URLTest load balancing

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-upstream-stable-urltest
  cancel-in-progress: false

jobs:
  build-release:
    if: github.repository == 'pomhg/sing-box'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: stable
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.12
          cache: true

      - name: Prepare latest upstream stable with URLTest
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/SagerNet/sing-box.git
          else
            git remote add upstream https://github.com/SagerNet/sing-box.git
          fi
          current_stable="$(git rev-parse HEAD)"
          echo "current_stable=${current_stable}" >> "${GITHUB_OUTPUT}"
          git fetch --tags upstream stable:refs/remotes/upstream/stable

          mapfile -t patch_commits < <(git log --reverse --format=%H --grep='Fork-Patch: urltest-load-balance')
          automation_commit="$(git log -1 --format=%H --grep='Fork-Automation: stable-release-build')"
          if [[ "${#patch_commits[@]}" -eq 0 ]]; then
            echo "URLTest load-balance patch commit was not found" >&2
            exit 1
          fi
          if [[ -z "${automation_commit}" ]]; then
            echo "Stable release automation commit was not found" >&2
            exit 1
          fi

          upstream_tag=""
          while IFS= read -r candidate; do
            if [[ "${candidate}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              upstream_tag="${candidate}"
              break
            fi
          done < <(git tag --merged upstream/stable --sort=-version:refname)
          if [[ -z "${upstream_tag}" ]]; then
            echo "No stable semantic-version tag was found on upstream/stable" >&2
            exit 1
          fi

          upstream_sha="$(git rev-parse refs/remotes/upstream/stable)"
          upstream_short="$(git rev-parse --short=8 "${upstream_sha}")"
          patch_digest="$(git show --format= --binary "${patch_commits[@]}" | sha256sum | cut -c1-8)"
          version="${upstream_tag#v}-urltest-lb.${upstream_short}.${patch_digest}"
          release_tag="v${version}"

          echo "upstream_sha=${upstream_sha}" >> "${GITHUB_OUTPUT}"
          echo "upstream_tag=${upstream_tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "Release ${release_tag} already exists; source and binary remain unchanged."
            exit 0
          fi

          echo "skip=false" >> "${GITHUB_OUTPUT}"
          automation_file="${RUNNER_TEMP}/sync-upstream-stable.yml"
          git show "${automation_commit}:.github/workflows/sync-upstream-stable.yml" > "${automation_file}"

          git reset --hard "${upstream_sha}"
          git cherry-pick "${patch_commits[@]}"

          # URLTest must not change upstream dependency versions or replacements.
          git diff --exit-code "${upstream_sha}" -- go.mod go.sum
          sing_tun_version="$(go list -m -f '{{.Version}}' github.com/sagernet/sing-tun)"
          sing_tun_replace="$(go list -m -f '{{if .Replace}}{{.Replace.Path}}{{end}}' github.com/sagernet/sing-tun)"
          if [[ -n "${sing_tun_replace}" ]]; then
            echo "Unexpected sing-tun replacement: ${sing_tun_replace}" >&2
            exit 1
          fi
          echo "sing_tun_version=${sing_tun_version}" >> "${GITHUB_OUTPUT}"

          mkdir -p .github/workflows
          find .github/workflows -type f -delete
          cp "${automation_file}" .github/workflows/sync-upstream-stable.yml
          git add .github/workflows
          git commit \
            -m "ci: build upstream stable with URLTest" \
            -m "Fork-Automation: stable-release-build"

          echo "build_commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Test URLTest and upstream pre-match routing
        if: steps.prepare.outputs.skip != 'true'
        run: go test -race github.com/sagernet/sing-tun ./protocol/tun ./protocol/group ./route

      - name: Build Linux amd64
        if: steps.prepare.outputs.skip != 'true'
        id: build
        env:
          BUILD_VERSION: ${{ steps.prepare.outputs.version }}
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        shell: bash
        run: |
          set -euo pipefail
          build_tags="$(cat release/DEFAULT_BUILD_TAGS),with_purego"
          shared_ldflags="$(cat release/LDFLAGS)"
          asset="sing-box-${BUILD_VERSION}-linux-amd64"
          mkdir -p dist
          go build -v -trimpath -o "dist/${asset}" \
            -tags "${build_tags}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${BUILD_VERSION}' ${shared_ldflags} -s -w -buildid=" \
            ./cmd/sing-box
          version_output="$("dist/${asset}" version)"
          echo "${version_output}"
          grep -q "with_naive_outbound" <<< "${version_output}"
          sha256sum "dist/${asset}" > "dist/${asset}.sha256"
          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: sing-box-${{ steps.prepare.outputs.version }}-linux-amd64
          path: |
            dist/${{ steps.build.outputs.asset }}
            dist/${{ steps.build.outputs.asset }}.sha256
          if-no-files-found: error

      - name: Publish synchronized stable
        if: steps.prepare.outputs.skip != 'true'
        env:
          CURRENT_STABLE: ${{ steps.prepare.outputs.current_stable }}
        run: git push --force-with-lease="refs/heads/stable:${CURRENT_STABLE}" origin HEAD:stable

      - name: Create GitHub release
        if: steps.prepare.outputs.skip != 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          UPSTREAM_SHA: ${{ steps.prepare.outputs.upstream_sha }}
          UPSTREAM_TAG: ${{ steps.prepare.outputs.upstream_tag }}
          BUILD_COMMIT: ${{ steps.prepare.outputs.build_commit }}
          SING_TUN_VERSION: ${{ steps.prepare.outputs.sing_tun_version }}
          ASSET: ${{ steps.build.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            "dist/${ASSET}" \
            "dist/${ASSET}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${BUILD_COMMIT}" \
            --title "sing-box ${RELEASE_TAG} Linux amd64" \
            --notes "Based on SagerNet/sing-box stable ${UPSTREAM_SHA} (latest stable release ${UPSTREAM_TAG}), using unmodified github.com/sagernet/sing-tun ${SING_TUN_VERSION}. Includes Naive outbound and URLTest modes: least_ping, failover, round_robin, random, least_connection, weighted_round_robin, and consistent_hash. Linux amd64 executable only; install libcronet.so separately when using Naive outbound."

      - name: Remove older custom releases and tags
        if: always() && steps.prepare.outcome == 'success' && (steps.prepare.outputs.skip == 'true' || steps.release.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_pattern='^v[0-9]+\.[0-9]+\.[0-9]+-urltest-lb\.[0-9a-f]{8}\.[0-9a-f]{8}$'

          while IFS= read -r old_tag; do
            if [[ -n "${old_tag}" && "${old_tag}" != "${RELEASE_TAG}" && "${old_tag}" =~ ${release_pattern} ]]; then
              gh release delete "${old_tag}" \
                --repo "${GITHUB_REPOSITORY}" \
                --cleanup-tag \
                --yes
            fi
          done < <(gh release list --repo "${GITHUB_REPOSITORY}" --limit 1000 --json tagName --jq '.[].tagName')

          while read -r _ ref; do
            tag="${ref#refs/tags/}"
            if [[ "${tag}" != "${RELEASE_TAG}" && "${tag}" =~ ${release_pattern} ]]; then
              git push origin ":${ref}"
            fi
          done < <(git ls-remote --tags --refs origin 'refs/tags/v*-urltest-lb.*')
